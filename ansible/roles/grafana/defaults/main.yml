---
grafana_domain: "grafana.{{ domain }}"
grafana_admin_user: admin
# Set to true when Grafana is served over HTTPS (for example behind a TLS proxy)
grafana_cookie_secure: false
grafana_ldap_enabled: false
grafana_smtp_enabled: false
# PostgreSQL connection for Grafana's own database (created by the postgresql role)
grafana_db_ssl_mode: require
grafana_prometheus_url: "http://{{ hostvars[groups['prometheus_servers'][0]]['ansible_host'] }}:9090"
grafana_dashboards_src: "{{ role_path }}/../../../monitoring/grafana/dashboards"
