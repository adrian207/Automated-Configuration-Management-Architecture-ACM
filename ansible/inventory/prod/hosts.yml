---
# Ansible Inventory - Production Environment
# Author: Adrian Johnson <adrian207@gmail.com>

all:
  vars:
    ansible_user: azureuser
    ansible_ssh_private_key_file: ~/.ssh/id_rsa
    env_name: prod
    domain: prod.contoso.com

management_tier:
  hosts:
    vault-01.prod.contoso.com:
      ansible_host: 10.20.10.20
      vault_node_id: 1
    vault-02.prod.contoso.com:
      ansible_host: 10.20.10.21
      vault_node_id: 2
    vault-03.prod.contoso.com:
      ansible_host: 10.20.10.22
      vault_node_id: 3
    dsc-pull-01.prod.contoso.com:
      ansible_host: 10.20.10.30
      dsc_node_type: primary
    dsc-pull-02.prod.contoso.com:
      ansible_host: 10.20.10.31
      dsc_node_type: secondary
    awx-01.prod.contoso.com:
      ansible_host: 10.20.10.40
  vars:
    tier: management
    subnet: 10.20.10.0/24

monitoring_tier:
  hosts:
    prometheus-01.prod.contoso.com:
      ansible_host: 10.20.20.10
    grafana-01.prod.contoso.com:
      ansible_host: 10.20.20.20
    alertmanager-01.prod.contoso.com:
      ansible_host: 10.20.20.30
  vars:
    tier: monitoring
    subnet: 10.20.20.0/24

data_tier:
  hosts:
    postgres-01.prod.contoso.com:
      ansible_host: 10.20.30.10
      postgresql_role: primary
      postgresql_replication_slot: postgres_01
    postgres-02.prod.contoso.com:
      ansible_host: 10.20.30.11
      postgresql_role: replica
      postgresql_replication_slot: postgres_02
  vars:
    tier: data
    subnet: 10.20.30.0/24

# Grouped by service
vault_cluster:
  hosts:
    vault-01.prod.contoso.com:
    vault-02.prod.contoso.com:
    vault-03.prod.contoso.com:
  vars:
    vault_version: "1.15.4"
    vault_cluster_name: "prod-vault-cluster"

dsc_pull_servers:
  hosts:
    dsc-pull-01.prod.contoso.com:
    dsc-pull-02.prod.contoso.com:
  vars:
    ansible_connection: winrm
    ansible_winrm_transport: ntlm
    ansible_winrm_server_cert_validation: ignore
    ansible_port: 5986
    ansible_user: azureadmin
    ansible_password: "{{ windows_admin_password }}"
    # The pull server listens on HTTP 8080 (see management-tier.yml); use HTTPS with a certificate in production
    dsc_pull_server_url: "http://{{ hostvars[groups['dsc_pull_servers'][0]]['ansible_host'] }}:8080/PSDSCPullServer.svc"

awx_servers:
  hosts:
    awx-01.prod.contoso.com:

alertmanager_servers:
  hosts:
    alertmanager-01.prod.contoso.com:

prometheus_servers:
  hosts:
    prometheus-01.prod.contoso.com:
  vars:
    prometheus_version: "2.48.0"
    prometheus_storage_retention: "30d"
    prometheus_storage_retention_size: "50GB"

grafana_servers:
  hosts:
    grafana-01.prod.contoso.com:
  vars:
    grafana_version: "10.2.2"
    grafana_admin_user: admin
    grafana_domain: grafana.prod.contoso.com

postgresql_cluster:
  hosts:
    postgres-01.prod.contoso.com:
    postgres-02.prod.contoso.com:
  vars:
    postgresql_version: "15"
    postgresql_max_connections: 200

# Linux nodes
linux_nodes:
  # Add managed nodes here, using the IPs from: terraform output managed_node_ips
  # (set linux_node_count in terraform/environments/prod/main.tf to create them), e.g.
  #   linux-node-01.prod.contoso.com:
  #     ansible_host: 10.20.100.4
  hosts: {}
  vars:
    node_os_family: RedHat

# Windows nodes
windows_nodes:
  # Add Windows nodes here with their ansible_host (windows_node_count in Terraform), e.g.
  #   win-node-01.prod.contoso.com:
  #     ansible_host: 10.20.100.5
  hosts: {}
  vars:
    ansible_connection: winrm
    # Local administrator created by Terraform; use kerberos with domain accounts once joined
    ansible_winrm_transport: ntlm
    ansible_user: azureadmin
    ansible_password: "{{ windows_admin_password }}"
    ansible_winrm_server_cert_validation: ignore
    ansible_port: 5986
    dsc_pull_server_url: "http://{{ hostvars[groups['dsc_pull_servers'][0]]['ansible_host'] }}:8080/PSDSCPullServer.svc"
