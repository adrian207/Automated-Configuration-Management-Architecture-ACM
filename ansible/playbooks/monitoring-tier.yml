---
# Monitoring Tier Deployment Playbook
# Author: Adrian Johnson <adrian207@gmail.com>
# Description: Deploys Prometheus, Grafana, and Alertmanager

- name: Deploy Prometheus
  hosts: prometheus_servers
  become: true
  roles:
    - common
    - prometheus
  tags:
    - prometheus

- name: Deploy Grafana
  hosts: grafana_servers
  become: true
  roles:
    - common
    - grafana
  tags:
    - grafana

- name: Deploy Alertmanager
  hosts: alertmanager_servers
  become: true
  roles:
    - common
    - alertmanager
  tags:
    - alertmanager

# The Prometheus datasource and the dashboards in monitoring/grafana/dashboards are
# provisioned by the grafana role; these two come from grafana.com.
- name: Import Grafana Dashboards
  hosts: grafana_servers
  become: true
  tasks:
    - name: Import Node Exporter dashboard
      community.grafana.grafana_dashboard:
        grafana_url: "http://localhost:3000"
        grafana_user: "{{ grafana_admin_user }}"
        grafana_password: "{{ grafana_admin_password }}"
        state: present
        commit_message: "Import Node Exporter dashboard"
        overwrite: true
        dashboard_id: 1860
        dashboard_revision: 27

    - name: Import PostgreSQL dashboard
      community.grafana.grafana_dashboard:
        grafana_url: "http://localhost:3000"
        grafana_user: "{{ grafana_admin_user }}"
        grafana_password: "{{ grafana_admin_password }}"
        state: present
        commit_message: "Import PostgreSQL dashboard"
        overwrite: true
        dashboard_id: 9628
        dashboard_revision: 7
