---
# Linux Node Configuration Playbook
# Author: Adrian Johnson <adrian207@gmail.com>
# Description: Configures Linux nodes for Ansible management and installs monitoring agents

- name: Configure Linux Managed Nodes
  hosts: linux_nodes
  become: true
  tasks:
    - name: Update package cache
      ansible.builtin.package:
        update_cache: true
      when: ansible_os_family in ['Debian', 'RedHat']

    - name: Install base packages
      ansible.builtin.package:
        name:
          - vim
          - curl
          - wget
          - git
          - htop
          - net-tools
          - python3
          - python3-pip
        state: present

    - name: Create ansible user
      ansible.builtin.user:
        name: ansible
        comment: Ansible Management User
        shell: /bin/bash
        groups: wheel
        append: true
        create_home: true

    - name: Set up sudo for ansible user
      ansible.builtin.copy:
        content: "ansible ALL=(ALL) NOPASSWD: ALL\n"
        dest: /etc/sudoers.d/ansible
        mode: '0440'
        validate: /usr/sbin/visudo -cf %s

    - name: Install Node Exporter
      ansible.builtin.include_role:
        name: node_exporter

    - name: Configure firewall for monitoring
      ansible.posix.firewalld:
        port: "{{ item }}/tcp"
        permanent: true
        state: enabled
        immediate: true
      loop:
        - 9100  # Node Exporter
      when: ansible_os_family == 'RedHat'
      failed_when: false  # firewalld may not be installed on every image

# Prometheus scrape targets for these nodes are written by deploy-monitoring-agents.yml
